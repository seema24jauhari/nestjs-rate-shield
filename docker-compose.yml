services:
  api:
    build: .
    container_name: rate-limiter-api
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  mongodb:
    image: mongo:8
    container_name: rate-limiter-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rate-limiter-redis
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: rate-limiter-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: rate-limiter-grafana
    ports:
      - "3001:3000"   # 3001 on your machine, because the API uses 3000
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mongo_data:
  prometheus_data:
  grafana_data: