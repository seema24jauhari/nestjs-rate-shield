name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

      - name: Check the Lua scripts are in the build
        run: |
          test -f dist/redis/lua-scripts/sliding-window.lua
          test -f dist/redis/lua-scripts/token-bucket.lua

      - run: npm test -- --passWithNoTests

      - name: Preview what npm would publish
        run: npm pack --dry-run